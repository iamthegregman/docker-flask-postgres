
services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app/:/home/app/
      - C:/Users/Gregt/sql_data/rdb_docker_01:/data/import
    depends_on:
      - db
    env_file: ./app/.env 

  db:
    image: postgres:17.4-alpine
    env_file: ./app/.env
    expose:
      - 5432
    environment:
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - C:/Users/Gregt/sql_data/rdb_docker_01:/data/import
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - C:/Users/Gregt/sql_data/rdb_docker_01:/data/import
    depends_on:
      - db
    env_file: ./app/.env    


volumes:
  postgres_data: